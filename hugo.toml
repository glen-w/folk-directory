baseURL = 'https://folkdirectory.co.uk/'
languageCode = 'en-gb'
title = 'Folk Directory'
theme = 'PaperMod'

[params]
  description = "A directory of folk music events across the UK — folk clubs, sessions, festivals and more."
  keywords = ["folk music", "folk clubs", "folk festivals", "sessions", "UK folk", "traditional music"]
  author = "Folk Directory"
  images = ["/images/logo/folk-directory-og.png"]

  defaultTheme = "auto"
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = false
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true

  [params.label]
    text = "Folk Directory"
    icon = "/images/logo/folk-directory-logo.png"
    iconHeight = 79

  [params.assets]
    favicon = "/favicon.ico"
    favicon16x16 = "/favicon-16x16.png"
    favicon32x32 = "/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"
    safari_pinned_tab = "/safari-pinned-tab.svg"
    theme_color = "#274F30"
    msapplication_TileColor = "#274F30"

  [[params.socialIcons]]
    name = "email"
    url = "/contact/"

  [params.schema]
    sameAs = ["https://folkdirectory.co.uk/contact/"]

  [params.submit]
    email = "glen.w.wright@gmail.com"
    githubNewIssue = "https://github.com/glen-w/folk-directory/issues/new?template=listing.yml"

  [params.profileMode]
    enabled = false

  [params.fuseOpts]
    iscasesensitive = false
    includescore = false
    includematches = false
    minmatchcharlength = 2
    shouldsort = true
    findallmatches = false
    keys = ["title", "permalink", "summary", "content", "tags", "categories", "locations", "event_types", "venue", "place", "address", "post_code", "when", "county"]
    location = 0
    threshold = 0.3
    distance = 100
    ignorelocation = true
    limit = 20

[menu]
  [[menu.main]]
    identifier = "listings"
    name = "Events"
    url = "/listings/"
    weight = 10
  [[menu.main]]
    identifier = "map"
    name = "Map"
    url = "/map/"
    weight = 12
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 15
  [[menu.main]]
    identifier = "links"
    name = "Links"
    url = "/links/"
    weight = 18
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 20
  [[menu.main]]
    identifier = "submit"
    name = "Submit / update"
    url = "/submit/"
    weight = 28
  [[menu.main]]
    identifier = "contact"
    name = "Contact"
    url = "/contact/"
    weight = 30

[taxonomies]
  category = "categories"
  tag = "tags"
  location = "locations"
  event_type = "event_types"

# JSON on home is required for /search/ — PaperMod's Fuse.js fetches /index.json
[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
